<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="4A0X1 Study Guide — Air Force CDC quiz app">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <pattern id="pin" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="none"/>
      <rect width="2" height="26" fill="#e2e8f0" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1200" height="360" fill="#f8fafc"/>
  <rect width="1200" height="360" fill="url(#pin)"/>
  <rect width="1200" height="6" fill="url(#accent)"/>
  <rect x="24" y="24" width="1152" height="312" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- left: brand block -->
  <g font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif">
    <!-- shield mark -->
    <rect x="72" y="66" width="56" height="56" rx="16" fill="url(#shield)"/>
    <path d="M100 78c-5.6 0-10.4 3.9-11.6 9.3-.4 1.7-.6 3.5-.6 5.2 0 8.6 5.2 13.4 11.4 16.4a1.6 1.6 0 0 0 1.6 0c6.2-3 11.4-7.8 11.4-16.4 0-1.7-.2-3.5-.6-5.2C110.4 81.9 105.6 78 100 78z" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M95.5 95.5l3.2 3.2 6-6.5" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- eyebrow -->
    <text x="152" y="92" font-size="15" font-weight="700" letter-spacing="4" fill="#4f46e5">USAF 4A0X1 · HEALTH SERVICES MANAGEMENT</text>
    <!-- title -->
    <text x="70" y="162" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-1">4A0X1 Study Guide</text>
    <!-- sub -->
    <text x="72" y="200" font-size="19" fill="#64748b">200 CDC practice questions — 5-level &amp; 7-level,</text>
    <text x="72" y="226" font-size="19" fill="#64748b">quiz sessions, missed-question review, progress stats.</text>

    <!-- chips -->
    <g font-size="14" font-weight="700">
      <rect x="72" y="256" width="150" height="36" rx="18" fill="#eef2ff"/>
      <text x="147" y="279" text-anchor="middle" fill="#4f46e5">200 questions</text>
      <rect x="234" y="256" width="150" height="36" rx="18" fill="#eef2ff"/>
      <text x="309" y="279" text-anchor="middle" fill="#4f46e5">5 + 7 level</text>
      <rect x="396" y="256" width="196" height="36" rx="18" fill="#eef2ff"/>
      <text x="494" y="279" text-anchor="middle" fill="#4f46e5">study · review · stats</text>
    </g>
  </g>

  <!-- right: quiz card in the app's own UI language -->
  <g font-family="'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif">
    <rect x="712" y="56" width="416" height="248" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="712" y="56" width="416" height="248" rx="18" fill="none" stroke="#0f172a" stroke-opacity="0.04" stroke-width="6"/>
    <text x="740" y="92" font-size="14" font-weight="700" fill="#4f46e5">Module 1 · Q1</text>
    <text x="1100" y="92" font-size="13" font-weight="600" fill="#10b981" text-anchor="end">✓ Verified</text>
    <text x="740" y="124" font-size="16.5" font-weight="600" fill="#0f172a">In the Air Force, what are the two</text>
    <text x="740" y="147" font-size="16.5" font-weight="600" fill="#0f172a">main types of customers…?</text>

    <!-- correct answer -->
    <rect x="740" y="162" width="360" height="34" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="762" cy="179" r="11" fill="#4f46e5"/>
    <text x="762" y="184" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="782" y="184" font-size="14" fill="#1e1b4b">Internal &amp; external customers</text>
    <text x="1082" y="184" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="end">✓</text>

    <!-- other answers -->
    <rect x="740" y="204" width="360" height="34" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="762" cy="221" r="11" fill="#f1f5f9"/>
    <text x="762" y="226" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">B</text>
    <text x="782" y="226" font-size="14" fill="#475569">Officers and enlisted personnel</text>

    <rect x="740" y="246" width="360" height="34" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="762" cy="263" r="11" fill="#f1f5f9"/>
    <text x="762" y="268" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">C</text>
    <text x="782" y="268" font-size="14" fill="#475569">Doctors and nurses</text>

    <!-- progress -->
    <rect x="740" y="292" width="300" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="740" y="292" width="96" height="6" rx="3" fill="#4f46e5"/>
    <text x="1100" y="298" font-size="12" fill="#94a3b8" text-anchor="end">32%</text>
  </g>
</svg>
