<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="monospace" role="img" aria-label="4A0X1 Study Guide hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0c"/><stop offset="1" stop-color="#060807"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect y="5" width="6" height="1" fill="#22c55e" opacity="0.05"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="1192" height="332" rx="26" fill="url(#bg)" stroke="#1d3a26" stroke-width="2.5"/>
  <rect x="4" y="4" width="1192" height="332" rx="26" fill="url(#scan)"/>

  <!-- quiz terminal card -->
  <g>
    <rect x="60" y="52" width="330" height="236" rx="14" fill="#0d120e" stroke="#2a5a38" stroke-width="2"/>
    <circle cx="86" cy="76" r="5" fill="#ff5f56"/><circle cx="104" cy="76" r="5" fill="#ffbd2e"/><circle cx="122" cy="76" r="5" fill="#27c93f"/>
    <text x="80" y="112" font-size="15" fill="#22c55e">$ quiz --cdc 4A0X1 --mixed</text>
    <text x="80" y="140" font-size="14" fill="#c9d4cb" font-family="sans-serif">Q047 · CDC 4A051 · Module 3</text>
    <text x="80" y="162" font-size="13" fill="#8fa898" font-family="sans-serif">Which AF form documents…?</text>
    <g font-size="13" font-family="sans-serif">
      <rect x="80" y="176" width="290" height="20" rx="10" fill="#123524"/>
      <text x="94" y="191" fill="#7bd88f">A · AF Form 422</text>
      <rect x="80" y="200" width="290" height="20" rx="10" fill="none" stroke="#1d3a26"/>
      <text x="94" y="215" fill="#8fa898">B · AF Form 1042</text>
      <rect x="80" y="224" width="290" height="20" rx="10" fill="none" stroke="#1d3a26"/>
      <text x="94" y="239" fill="#8fa898">C · AF Form 422B</text>
    </g>
    <text x="80" y="272" font-size="13" fill="#22c55e">✔ correct · streak ×12</text>
  </g>

  <text x="440" y="98" font-size="17" fill="#22c55e" letter-spacing="6">BUILTBYSAI // CDC QUIZ APP</text>
  <text x="438" y="162" font-size="62" fill="#f3efe4" font-weight="bold">4A0X1 Study Guide</text>
  <text x="440" y="200" font-size="20" fill="#9db3a4">quiz + study app for AF Health Services Management CDCs</text>

  <g font-size="14" fill="#7bd88f">
    <rect x="440" y="230" width="132" height="30" rx="15" fill="none" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="506" y="250" text-anchor="middle">200 questions</text>
    <rect x="584" y="230" width="140" height="30" rx="15" fill="none" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="654" y="250" text-anchor="middle">5 + 7 level</text>
    <rect x="736" y="230" width="172" height="30" rx="15" fill="none" stroke="#1d3a26" stroke-width="1.5"/>
    <text x="822" y="250" text-anchor="middle">missed-q review</text>
  </g>
  <text x="440" y="296" font-size="14" fill="#4c6b57">timed / untimed sessions · progress stats · React + Vite + TS</text>
  <text x="1150" y="308" font-size="13" fill="#33503c" text-anchor="end">4a0x1-study-guide</text>
</svg>
